name: Deploy site to GitHub Pages

# Build the ICA textbook from its sources, validate it, and publish docs/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical and figure dependencies
        run: python -m pip install -r book/requirements-figures.txt

      - name: Build and validate ICA textbook
        run: |
          node book/build.mjs --strict
          python scripts/check_book.py --run-code
          python scripts/test_book_quality.py
          python scripts/tests_math_background.py
          python scripts/tests_foundations.py
          python scripts/tests_algorithms.py
          python scripts/tests_advanced.py
          python scripts/tests_figures.py
          python scripts/tests_performance_figure.py
          python scripts/tests_beginner.py
          node scripts/tests_beginner_lab.cjs

      - name: Validate site quality
        run: python3 scripts/check_site_quality.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
